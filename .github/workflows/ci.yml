# =============================================================================
# CI WORKFLOW
# =============================================================================
# Runs on PRs and pushes to validate code changes
# - Terraform: fmt, validate, plan
# - React Web: lint, test, build
# - iOS: build and test for simulator
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - 'feature/**'
      - dev
      - main

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # TERRAFORM CI
  # ============================================================================
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest
    # Only run if terraform files changed
    if: |
      github.event_name == 'pull_request' && 
      contains(github.event.pull_request.changed_files, 'terraform/')
    
    defaults:
      run:
        working-directory: terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.9.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (DEV)
        id: init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.TF_STATE_REGION }}" \
            -backend-config="key=skaldcraft/dev/terraform.tfstate"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan (DEV)
        id: plan
        run: |
          terraform plan \
            -var-file="dev.tfvars" \
            -out=tfplan-dev \
            -no-color
        env:
          TF_VAR_environment: dev
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-plan-dev
          path: terraform/tfplan-dev
          retention-days: 5

      - name: Comment PR with Terraform Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail if Terraform checks failed
        if: steps.fmt.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # REACT WEB CI
  # ============================================================================
  web-ci:
    name: Web CI
    runs-on: ubuntu-latest
    # Run on PRs or if static_site files changed
    if: |
      github.event_name == 'pull_request' || 
      contains(github.event.head_commit.modified, 'static_site/') ||
      contains(github.event.head_commit.added, 'static_site/')
    
    defaults:
      run:
        working-directory: static_site
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: static_site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        id: lint
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found, skipping"
          fi
        continue-on-error: true

      - name: Run tests
        id: test
        run: |
          if npm run | grep -q "test"; then
            npm test -- --ci --coverage --watchAll=false
          else
            echo "No test script found, skipping"
          fi
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: static_site/build/
          retention-days: 5

      - name: Check build output
        run: |
          if [ -d "build" ]; then
            echo "Build directory found"
            ls -la build/
          elif [ -d "dist" ]; then
            echo "Dist directory found"
            ls -la dist/
          else
            echo "No build output directory found!"
            exit 1
          fi

  # ============================================================================
  # iOS MOBILE CI
  # ============================================================================
  ios-ci:
    name: iOS CI
    runs-on: macos-14
    # Run on PRs or if mobile files changed
    if: |
      github.event_name == 'pull_request' || 
      contains(github.event.head_commit.modified, 'mobile/') ||
      contains(github.event.head_commit.added, 'mobile/')
    
    defaults:
      run:
        working-directory: mobile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            mobile/SkaldCraft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
            mobile/SkaldCraft.xcworkspace/xcshareddata/swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Detect project structure
        id: detect
        run: |
          if [ -f "SkaldCraft.xcworkspace/contents.xcworkspacedata" ]; then
            echo "Using workspace"
            echo "use_workspace=true" >> $GITHUB_OUTPUT
            echo "project_file=SkaldCraft.xcworkspace" >> $GITHUB_OUTPUT
          elif [ -f "SkaldCraft.xcodeproj/project.pbxproj" ]; then
            echo "Using project"
            echo "use_workspace=false" >> $GITHUB_OUTPUT
            echo "project_file=SkaldCraft.xcodeproj" >> $GITHUB_OUTPUT
          else
            echo "No Xcode project or workspace found!"
            exit 1
          fi

      - name: Build for simulator
        run: |
          if [ "${{ steps.detect.outputs.use_workspace }}" == "true" ]; then
            xcodebuild clean build \
              -workspace ${{ steps.detect.outputs.project_file }} \
              -scheme SkaldCraft \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | tee build.log | xcpretty
          else
            xcodebuild clean build \
              -project ${{ steps.detect.outputs.project_file }} \
              -scheme SkaldCraft \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
              -configuration Debug \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | tee build.log | xcpretty
          fi

      - name: Run tests
        id: test
        run: |
          if [ "${{ steps.detect.outputs.use_workspace }}" == "true" ]; then
            xcodebuild test \
              -workspace ${{ steps.detect.outputs.project_file }} \
              -scheme SkaldCraft \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
              -testPlan SkaldCraft \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | tee test.log | xcpretty
          else
            xcodebuild test \
              -project ${{ steps.detect.outputs.project_file }} \
              -scheme SkaldCraft \
              -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              | tee test.log | xcpretty
          fi
        continue-on-error: true

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: |
            mobile/build.log
            mobile/test.log
          retention-days: 5

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 5

