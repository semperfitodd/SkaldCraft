name: CI - Build and Test

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  TERRAFORM_VERSION: '1.9.0'

jobs:
  # Build React Static Site
  build-static-site:
    name: Build Static Site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./static_site
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --watchAll=false

      - name: Build static site
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-site-build
          path: static_site/build/
          retention-days: 7

  # Build Lambda Shared Layer
  build-lambda-shared:
    name: Build Lambda Shared Layer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/lambda_shared
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install all dependencies (including dev)
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --production

      - name: Create layer structure
        run: |
          mkdir -p layer/nodejs
          cp -r node_modules layer/nodejs/
          cp *.js layer/nodejs/
          cp package.json layer/nodejs/

      - name: Create layer zip
        run: |
          cd layer
          zip -r ../lambda_shared_layer.zip nodejs/

      - name: Upload layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-shared-layer
          path: terraform/lambda_shared/lambda_shared_layer.zip
          retention-days: 7

  # Build Lambda Functions
  build-lambda-profiles:
    name: Build Lambda Profiles
    runs-on: ubuntu-latest
    needs: build-lambda-shared
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared layer dependencies first
        working-directory: ./terraform/lambda_shared
        run: |
          npm ci
          npm run build

      - name: Install all dependencies (including dev)
        working-directory: ./terraform/lambda_profiles
        run: npm ci

      - name: Build TypeScript
        working-directory: ./terraform/lambda_profiles
        run: npm run build

      - name: Install production dependencies only
        working-directory: ./terraform/lambda_profiles
        run: |
          rm -rf node_modules
          npm ci --production

      - name: Create deployment package
        working-directory: ./terraform/lambda_profiles
        run: |
          zip -r lambda_profiles.zip *.js node_modules/ package.json

      - name: Upload lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-profiles
          path: terraform/lambda_profiles/lambda_profiles.zip
          retention-days: 7

  build-lambda-stories:
    name: Build Lambda Stories
    runs-on: ubuntu-latest
    needs: build-lambda-shared
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared layer dependencies first
        working-directory: ./terraform/lambda_shared
        run: |
          npm ci
          npm run build

      - name: Install all dependencies (including dev)
        working-directory: ./terraform/lambda_stories
        run: npm ci

      - name: Build TypeScript
        working-directory: ./terraform/lambda_stories
        run: npm run build

      - name: Install production dependencies only
        working-directory: ./terraform/lambda_stories
        run: |
          rm -rf node_modules
          npm ci --production

      - name: Create deployment package
        working-directory: ./terraform/lambda_stories
        run: |
          zip -r lambda_stories.zip *.js node_modules/ package.json

      - name: Upload lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-stories
          path: terraform/lambda_stories/lambda_stories.zip
          retention-days: 7

  build-lambda-child-stories:
    name: Build Lambda Child Stories
    runs-on: ubuntu-latest
    needs: build-lambda-shared
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build shared layer dependencies first
        working-directory: ./terraform/lambda_shared
        run: |
          npm ci
          npm run build

      - name: Install all dependencies (including dev)
        working-directory: ./terraform/lambda_child_stories
        run: npm ci

      - name: Build TypeScript
        working-directory: ./terraform/lambda_child_stories
        run: npm run build

      - name: Install production dependencies only
        working-directory: ./terraform/lambda_child_stories
        run: |
          rm -rf node_modules
          npm ci --production

      - name: Create deployment package
        working-directory: ./terraform/lambda_child_stories
        run: |
          zip -r lambda_child_stories.zip *.js node_modules/ package.json

      - name: Upload lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-child-stories
          path: terraform/lambda_child_stories/lambda_child_stories.zip
          retention-days: 7

  # Validate Terraform
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Create dummy build artifacts for validation
        run: |
          mkdir -p builds
          touch builds/lambda_shared_layer.zip
          touch builds/lambda_profiles.zip
          touch builds/lambda_stories.zip
          touch builds/lambda_child_stories.zip

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # Build iOS App (macOS runner required)
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    defaults:
      run:
        working-directory: ./mobile
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            mobile/SkaldCraft.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
            mobile/SkaldCraft.xcworkspace/xcshareddata/swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -workspace SkaldCraft.xcworkspace -scheme SkaldCraft

      - name: Build iOS App
        run: |
          xcodebuild build \
            -workspace SkaldCraft.xcworkspace \
            -scheme SkaldCraft \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO

      - name: Run iOS Tests
        run: |
          xcodebuild test \
            -workspace SkaldCraft.xcworkspace \
            -scheme SkaldCraft \
            -configuration Debug \
            -destination 'id=dvtdevice-DVTiOSDeviceSimulatorPlaceholder-iphonesimulator:placeholder' \
            -derivedDataPath build/ \
            CODE_SIGNING_ALLOWED=NO

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - build-static-site
      - build-lambda-shared
      - build-lambda-profiles
      - build-lambda-stories
      - build-lambda-child-stories
      - terraform-validate
      - build-ios
    if: always()
    
    steps:
      - name: Check build status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed successfully"
