name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod
      terraform_action:
        description: 'Terraform action'
        required: true
        type: choice
        default: 'apply'
        options:
          - plan
          - apply

env:
  NODE_VERSION: '20.x'
  TERRAFORM_VERSION: '1.9.0'
  AWS_REGION: 'us-east-1'

jobs:
  # Determine environment
  setup:
    name: Setup Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      terraform_action: ${{ steps.set-env.outputs.terraform_action }}
    
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "terraform_action=${{ github.event.inputs.terraform_action }}" >> $GITHUB_OUTPUT
          else
            # Auto-deploy to dev on main branch push
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "terraform_action=apply" >> $GITHUB_OUTPUT
          fi

      - name: Display deployment info
        run: |
          echo "Deploying to: ${{ steps.set-env.outputs.environment }}"
          echo "Terraform action: ${{ steps.set-env.outputs.terraform_action }}"

  # Build all artifacts
  build:
    name: Build All Artifacts
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Build Static Site
      - name: Build static site
        working-directory: ./static_site
        run: |
          npm ci
          npm run build

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site-build
          path: static_site/build/
          retention-days: 1

      # Build Lambda Shared Layer
      - name: Build Lambda Shared Layer
        working-directory: ./terraform/lambda_shared
        run: |
          npm ci
          npm run build
          rm -rf node_modules
          npm ci --production
          mkdir -p layer/nodejs
          cp -r node_modules layer/nodejs/
          cp *.js layer/nodejs/
          cp package.json layer/nodejs/
          cd layer
          zip -r ../lambda_shared_layer.zip nodejs/

      - name: Upload Lambda Shared Layer
        uses: actions/upload-artifact@v4
        with:
          name: lambda-shared-layer
          path: terraform/lambda_shared/lambda_shared_layer.zip
          retention-days: 1

      # Build Lambda Profiles
      - name: Build Lambda Profiles
        working-directory: ./terraform/lambda_profiles
        run: |
          npm ci
          npm run build
          rm -rf node_modules
          npm ci --production
          zip -r lambda_profiles.zip *.js node_modules/ package.json

      - name: Upload Lambda Profiles
        uses: actions/upload-artifact@v4
        with:
          name: lambda-profiles
          path: terraform/lambda_profiles/lambda_profiles.zip
          retention-days: 1

      # Build Lambda Stories
      - name: Build Lambda Stories
        working-directory: ./terraform/lambda_stories
        run: |
          npm ci
          npm run build
          rm -rf node_modules
          npm ci --production
          zip -r lambda_stories.zip *.js node_modules/ package.json

      - name: Upload Lambda Stories
        uses: actions/upload-artifact@v4
        with:
          name: lambda-stories
          path: terraform/lambda_stories/lambda_stories.zip
          retention-days: 1

      # Build Lambda Child Stories
      - name: Build Lambda Child Stories
        working-directory: ./terraform/lambda_child_stories
        run: |
          npm ci
          npm run build
          rm -rf node_modules
          npm ci --production
          zip -r lambda_child_stories.zip *.js node_modules/ package.json

      - name: Upload Lambda Child Stories
        uses: actions/upload-artifact@v4
        with:
          name: lambda-child-stories
          path: terraform/lambda_child_stories/lambda_child_stories.zip
          retention-days: 1

  # Deploy with Terraform
  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment: ${{ needs.setup.outputs.environment }}
    defaults:
      run:
        working-directory: ./terraform
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare build artifacts
        run: |
          mkdir -p builds
          cp ../artifacts/lambda-shared-layer/lambda_shared_layer.zip builds/
          cp ../artifacts/lambda-profiles/lambda_profiles.zip builds/
          cp ../artifacts/lambda-stories/lambda_stories.zip builds/
          cp ../artifacts/lambda-child-stories/lambda_child_stories.zip builds/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ needs.setup.outputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="${{ needs.setup.outputs.environment }}.tfvars" \
            -var="adult_story_model_id=${{ secrets.ADULT_STORY_MODEL_ID }}" \
            -var="adult_summarizer_model_id=${{ secrets.ADULT_SUMMARIZER_MODEL_ID }}" \
            -var="apple_app_id=${{ secrets.APPLE_APP_ID }}" \
            -var="apple_key_id=${{ secrets.APPLE_KEY_ID }}" \
            -var="apple_private_key=${{ secrets.APPLE_PRIVATE_KEY }}" \
            -var="apple_team_id=${{ secrets.APPLE_TEAM_ID }}" \
            -var="google_client_id=${{ secrets.GOOGLE_CLIENT_ID }}" \
            -var="google_client_secret=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -out=tfplan

      - name: Terraform Apply
        if: needs.setup.outputs.terraform_action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        if: needs.setup.outputs.terraform_action == 'apply'
        id: terraform-outputs
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> $GITHUB_OUTPUT
          echo "frontend_url=$(terraform output -raw frontend_url)" >> $GITHUB_OUTPUT
          echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT
          echo "website_bucket=$(terraform output -raw static_site_bucket)" >> $GITHUB_OUTPUT
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_OUTPUT

      - name: Upload static site to S3
        if: needs.setup.outputs.terraform_action == 'apply'
        run: |
          aws s3 sync ../artifacts/static-site-build/ s3://${{ steps.terraform-outputs.outputs.website_bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "manifest.json" \
            --exclude "robots.txt"
          
          # Upload files that should not be cached aggressively
          aws s3 cp ../artifacts/static-site-build/index.html s3://${{ steps.terraform-outputs.outputs.website_bucket }}/index.html \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp ../artifacts/static-site-build/manifest.json s3://${{ steps.terraform-outputs.outputs.website_bucket }}/manifest.json \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp ../artifacts/static-site-build/robots.txt s3://${{ steps.terraform-outputs.outputs.website_bucket }}/robots.txt \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        if: needs.setup.outputs.terraform_action == 'apply'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.terraform-outputs.outputs.cloudfront_distribution_id }} \
            --paths "/*"

      - name: Deployment Summary
        if: needs.setup.outputs.terraform_action == 'apply'
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### URLs" >> $GITHUB_STEP_SUMMARY
          echo "- **Website:** https://${{ steps.terraform-outputs.outputs.frontend_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API:** https://${{ steps.terraform-outputs.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cognito" >> $GITHUB_STEP_SUMMARY
          echo "- **User Pool ID:** ${{ steps.terraform-outputs.outputs.cognito_user_pool_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Client ID:** ${{ steps.terraform-outputs.outputs.cognito_client_id }}" >> $GITHUB_STEP_SUMMARY
